<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Threat Detector</title>
</head>
<body>
    <h1>AI Threat Detector</h1>
    <form method="POST" action="/analyze">
        <textarea name="message" rows="4" cols="50" placeholder="Enter the suspicious message here"></textarea><br><br>
        <input type="submit" value="Analyze">
    </form>

    {% if result %}
        <h2>Result: {{ result }}</h2>
    {% endif %}
</body>
</html>
